<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Manager</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: hsl(67, 84%, 31%);
            text-align: center;
            padding: 30px;
        }
        input{
            padding: 10px;
            margin: 5px;
            width: 250px;
        }
        button{
            padding: 10px 20px;
            margin: 15px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover{
            background-color: darkblue;
        }
        #profile {
            background-color: white;
            width: 400px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgb(182, 44, 44);
            text-align: center;
        }
        #profile h2 {
            text-align: center;
            color: blue;
        }
        #profile p{
            font-size: 17px;
        }
    </style>
</head>

<body>
    <h1>Student Profile Manager</h1><br>
    <input type="text" id="name" placeholder="Enter Name"><br>
    <input type="text" id="roll" placeholder="Enter Roll Number"><br>
    <input type="text" id="department" placeholder="Enter Department"><br>
    <input type="number" id="cgpa" step="0.01" placeholder="Enter CGPA"><br>
    <button id="displayBtn">Display Profile</button>
    <div id="profile"></div>
    <script>

        // Create Student class
        class Student {
            constructor(name, roll, department, cgpa) {
                this.name = name;
                this.roll = roll;
                this.department = department;
                this.cgpa = cgpa;
            }
        }
        // Select button
        const button = document.getElementById("displayBtn");
        // Add click event
        button.addEventListener("click", function() {

            // Get values from input fields
            const name = document.getElementById("name").value;
            const roll = document.getElementById("roll").value;
            const department = document.getElementById("department").value;
            const cgpa = document.getElementById("cgpa").value;

            // Create Student object
            const student = new Student(name,roll,department,cgpa);

            // Select profile container
            const profile = document.getElementById("profile");
            // Clear previous profile
            profile.innerHTML = "";
            // Create heading
            const heading = document.createElement("h2");
            heading.textContent = "Student Profile";
            // Create paragraphs
            const namePara = document.createElement("p");
            namePara.textContent = "Name : " + student.name;
            const rollPara = document.createElement("p");
            rollPara.textContent = "Roll No : " + student.roll;
            const deptPara = document.createElement("p");
            deptPara.textContent = "Department : " + student.department;
            const cgpaPara = document.createElement("p");
            cgpaPara.textContent = "CGPA : " + student.cgpa;

            // Add elements to webpage
            profile.appendChild(heading);
            profile.appendChild(namePara);
            profile.appendChild(rollPara);
            profile.appendChild(deptPara);
            profile.appendChild(cgpaPara);
        });

    </script>

</body>
</html>
