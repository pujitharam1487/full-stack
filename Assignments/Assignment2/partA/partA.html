<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Styled Webpage</title>
</head>

<body>
    <h2>Canvas Example</h2>
    <canvas id="myCanvas" width="500" height="300" style="border:2px solid rgb(20, 1, 1);"></canvas>
    <script>
        let canvas = document.getElementById('myCanvas');
        let ctx = canvas.getContext("2d");
        ctx.fillStyle = "blue";
        ctx.fillRect(30, 30, 120, 70);
        
        ctx.beginPath();
        ctx.arc(250, 65, 35, 0, 2 * Math.PI);
        ctx.fillStyle = "red";
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(30, 150);
        ctx.lineTo(250, 150);
        ctx.strokeStyle = "black";
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.font ="24px Arial";
        ctx.fillStyle = "green";
        ctx.fillText("REDDIPUJITHARAM", 30, 230);
    </script>
</body>

</html>
