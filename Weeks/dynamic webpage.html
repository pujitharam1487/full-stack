<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Webpage Using JavaScript</title>
    <style>
        body{
    font-family: Arial, sans-serif;
    background-color: rgb(173, 230, 206);
    text-align: left;
    margin: 0;
}
header{
    background-color: navy;
    color: white;
    padding: 20px;
}
.container{
    margin-top: 50px;
}
button{
    padding: 10px 20px;
    margin: 10px;
    background-color: green;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
button:hover{
    background-color: rgb(236, 10, 44);
}
p{
    font-size: 20px;
    color: white;
    margin-top: 20px;
}
    </style>
</head>
<body>
    <header>
        <h1>Dynamic Webpage Using JavaScript</h1>
    </header>
    <div class="container">
        <h2 id="message">Welcome to JavaScript</h2>
        <button onclick="changeText()">Change Text</button>
        <button onclick="changeColor()">Change Background</button>
        <button onclick="showTime()">Show Time</button>
        <p id="time"></p>
    </div>
    <script>
        // Change the heading text
function changeText() {
    document.getElementById("message").innerHTML =
    "JavaScript Makes Webpages Dynamic!";
}

// Change the background color
function changeColor() {
    document.body.style.backgroundColor = "orange";
}

// Display current date and time
function showTime() {
    let now = new Date();
    document.getElementById("time").innerHTML = "Current Time: " + now.toLocaleString();
}
    </script>

</body>
</html>
