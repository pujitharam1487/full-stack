<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Product Calculator</title>
</head>

<body>

    <h2>Interactive Product Calculator</h2>

    <label>Product Name:</label>
    <input type="text" id="productName" placeholder="Enter product name">
    <br><br>

    <label>Quantity:</label>
    <input type="number" id="quantity" value="1" min="1">
    <br><br>

    <label>Price:</label>
    <input type="number" id="price" value="100" min="0">
    <br><br>

    <button id="calculateBtn">Calculate Total</button>

    <h3 id="result">Total Price: ₹0</h3>

    <script>
        // Function to calculate total price
        function calculateTotal() {
            let quantity = Number(document.getElementById("quantity").value);
            let price = Number(document.getElementById("price").value);

            let total = quantity * price;

            document.getElementById("result").textContent =
                "Total Price: ₹" + total;
        }

        // Event listeners
        document.getElementById("quantity")
            .addEventListener("input", calculateTotal);

        document.getElementById("price")
            .addEventListener("input", calculateTotal);

        document.getElementById("calculateBtn")
            .addEventListener("click", calculateTotal);
    </script>

</body>
</html>
